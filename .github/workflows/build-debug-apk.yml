name: Build Debug APK

# Runs on every push/PR to main, plus manual trigger from the Actions tab.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace

      # Auto-release: on a green main build whose versionName has no tag yet,
      # cut v<versionName> AND publish the release with the APK in this same
      # run — no dependence on the tag push re-firing the workflow (GitHub
      # dedupes that event when the tag points at the built commit).
      - name: Auto-tag release
        id: autotag
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VER" ]; then echo "::error::could not read versionName"; exit 1; fi
          TAG="v${VER}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists — skipping auto-tag"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Boy Offi9"
            git config user.email "boyxoffi9@gmail.com"
            git tag -a "${TAG}" -m "Release ${TAG} (auto: green build on main)"
            git push origin "${TAG}"
            echo "::notice::auto-tagged ${TAG} after a green build"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # Publish the release directly from the main run: step outputs carry the
      # version from the auto-tag step, so the APK ships in the SAME run.
      - name: Release APK
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.autotag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.autotag.outputs.tag }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
