name: Build Debug APK

# Runs on every push/PR to main, plus manual trigger from the Actions tab.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo doesn't commit a Gradle wrapper jar (binary file), so CI
      # uses this action to provision Gradle itself instead of relying on
      # ./gradlew. If you later run `gradle wrapper` locally and commit the
      # wrapper, you can switch this back to `./gradlew ...`.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # setup-gradle submits a GitHub dependency graph on pushes to the
          # default branch by default, which needs GITHUB_TOKEN + a
          # contents: write permission neither of which are wired up here.
          # We don't need that feature, so just turn it off.
          dependency-graph: disable

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-rain-demo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
